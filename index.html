<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07090f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Política Live">
<title>Política Live — Votação</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow"></div>

<button class="fs-btn" id="btn-fullscreen" title="Tela cheia" aria-label="Tela cheia">⛶</button>

<main>
  <section class="cards" id="cards"></section>

  <div class="total-bar">
    <span class="total-icon">🗳️</span>
    <span class="total-label">TOTAL DE VOTOS:</span>
    <span class="total-value" id="total">0</span>
  </div>

  <div class="finish-wrap">
    <button class="finish-btn" id="btn-finish"><span>🏁</span> Finalizar votação</button>
  </div>
</main>

<!-- Modal de resultado -->
<div class="modal" id="modal-result" hidden>
  <div class="modal-box">
    <h2>Resultado Final</h2>
    <div id="result-body"></div>
    <button class="finish-btn small" id="btn-close-result">Fechar</button>
  </div>
</div>

<!-- Modal de edição -->
<div class="modal" id="modal-edit" hidden>
  <div class="modal-box">
    <h2>Editar candidatos</h2>
    <div id="edit-body" class="edit-body"></div>
    <div class="edit-actions">
      <button class="ghost-btn" id="btn-cancel-edit">Cancelar</button>
      <button class="finish-btn small" id="btn-save-edit">Salvar</button>
    </div>
  </div>
</div>

<!-- Vercel Web Analytics (site estático) -->
<script defer src="/_vercel/insights/script.js"></script>

<script>
/* Service worker: só funciona em http(s), não em file:// */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* Botão de tela cheia — reserva para quando o app roda numa aba do navegador.
   Instalado como PWA ele já abre em tela cheia e o botão se esconde. */
(function () {
  const btn = document.getElementById("btn-fullscreen");
  const instalado = matchMedia("(display-mode: fullscreen)").matches ||
                    matchMedia("(display-mode: standalone)").matches ||
                    navigator.standalone === true;
  if (instalado || !document.documentElement.requestFullscreen) {
    btn.remove();
    return;
  }
  btn.addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => {
    btn.textContent = document.fullscreenElement ? "⤫" : "⛶";
  });
})();
</script>

<script src="app.js"></script>
</body>
</html>
